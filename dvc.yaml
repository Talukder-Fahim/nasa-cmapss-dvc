stages:
  preprocess:
    cmd: python src/preprocess.py
    deps:
    - data/raw/train_FD001.txt
    - src/preprocess.py
    params:
    - rul_cap
    outs:
    - data/processed/train_FD001_processed.csv
  train:
    cmd: python src/train.py
    deps:
    - data/processed/train_FD001_processed.csv
    - src/train.py
    params:
    - max_depth
    - n_estimators
    - random_state
    - test_size
    outs:
    - data/processed/test_split.csv
    - model.pkl
  evaluate:
    cmd: python src/evaluate.py
    deps:
    - data/processed/test_split.csv
    - model.pkl
    - src/evaluate.py
    metrics:
    - metrics.json:
        cache: false
  drift_check:
    cmd: python src/drift_check.py
    deps:
      - data/raw/train_FD001.txt
      - data/raw/train_FD002.txt
      - src/drift_check.py
    outs:
      - drift_report.html
